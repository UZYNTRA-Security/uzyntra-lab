name: CI — Build & Type Check

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & TypeScript Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Next.js build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://recon.lab.uzyntra.com
          NEXT_PUBLIC_LAB_ENV: production

      - name: Verify no real secrets in source
        run: |
          # Fail if any real-looking secrets are committed
          # (training lab should only have fake data)
          if grep -rE "(AKIA[A-Z0-9]{16}|ghp_[a-zA-Z0-9]{36})" src/ --include="*.ts" --include="*.tsx"; then
            echo "ERROR: Possible real AWS key or GitHub token found in source"
            exit 1
          fi
          echo "✓ No real secrets detected"
